 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة البندول الفيزيائي</title>
    <style>
        /* أنماط CSS تبقى كما هي */
        /* ... */
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- واجهة HTML تبقى كما هي -->
    <!-- ... -->

    <script>
        // العناصر الأساسية
        const canvas = document.getElementById('pendulumCanvas');
        const ctx = canvas.getContext('2d');
        const freqSlider = document.getElementById('frequency');
        const ampSlider = document.getElementById('amplitude');
        const oscSlider = document.getElementById('oscillations');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressBar = document.getElementById('progressBar');
        
        // المتغيرات
        let frequency = parseFloat(freqSlider.value);
        let amplitude = parseFloat(ampSlider.value);
        let oscillations = parseFloat(oscSlider.value); // تغيير إلى float
        const length = 200;
        const PI = Math.PI;
        let angle = 0;
        let time = 0;
        let animationId = null;
        let isRunning = false;
        let startTime = 0;
        let currentOscillations = 0;
        let shouldStopAtZero = false;
        
        // تعديل المنزلق ليقبل القيم الكسرية
        oscSlider.step = "0.25";
        oscSlider.min = "0.25";
        
        // تحديث القيم
        function updateValues() {
            frequency = parseFloat(freqSlider.value);
            amplitude = parseFloat(ampSlider.value);
            oscillations = parseFloat(oscSlider.value);
            
            document.getElementById('frequencyValue').textContent = frequency.toFixed(1);
            document.getElementById('amplitudeValue').textContent = amplitude;
            document.getElementById('oscillationsValue').textContent = oscillations;
        }
        
        // رسم البندول
        function drawPendulum() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = 100;
            const maxAngle = amplitude * PI / 180;
            
            // حساب الزاوية مع ضمان العودة للصفر عند التوقف
            if (isRunning) {
                angle = maxAngle * Math.sin(2 * PI * frequency * time);
            } else {
                angle = 0; // إعادة البندول للزاوية 0 عند التوقف
            }
            
            const bobX = centerX + length * Math.sin(angle);
            const bobY = centerY + length * Math.cos(angle);
            
            // رسم الخيط
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(bobX, bobY);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // رسم الكتلة
            ctx.beginPath();
            ctx.arc(bobX, bobY, 25, 0, 2 * PI);
            ctx.fillStyle = '#4285f4';
            ctx.fill();
            
            // رسم نقطة التعليق
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * PI);
            ctx.fillStyle = '#ea4335';
            ctx.fill();
            
            // تحديث المعلومات
            document.getElementById('elapsedTime').textContent = time.toFixed(2) + ' ثانية';
            document.getElementById('currentAngle').textContent = (angle * 180 / PI).toFixed(2) + '°';
            document.getElementById('oscillationCounter').textContent = currentOscillations.toFixed(2);
            
            // شريط التقدم
            const progress = (time * frequency) / oscillations * 100;
            progressBar.style.width = `${Math.min(100, progress)}%`;
        }
        
        // المحاكاة
        function simulate(timestamp) {
            if (!startTime) startTime = timestamp;
            
            time = (timestamp - startTime) / 1000;
            
            // حساب الاهتزازات بدقة (تسمح بالكسور)
            currentOscillations = (time * frequency);
            
            // التوقف عند الوصول لعدد الاهتزازات المطلوبة
            // مع ضمان التوقف عند الزاوية 0 إذا كانت قيمة زوجية من نصف الاهتزاز
            if (currentOscillations >= oscillations) {
                // حساب إذا كنا عند نقطة الصفر (نصف عدد صحيح من الاهتزازات)
                const remainder = (currentOscillations * 2) % 2;
                if (remainder === 0) {
                    shouldStopAtZero = true;
                }
                
                if (shouldStopAtZero) {
                    const targetTime = oscillations / frequency;
                    if (time >= targetTime) {
                        stopSimulation();
                        return;
                    }
                } else {
                    stopSimulation();
                    return;
                }
            }
            
            drawPendulum();
            
            if (isRunning) {
                animationId = requestAnimationFrame(simulate);
            }
        }
        
        function startSimulation() {
            isRunning = true;
            shouldStopAtZero = false;
            startTime = 0;
            currentOscillations = 0;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            animationId = requestAnimationFrame(simulate);
        }
        
        function stopSimulation() {
            isRunning = false;
            cancelAnimationFrame(animationId);
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            drawPendulum(); // إعادة الرسم لضمان العودة للصفر
        }
        
        function resetSimulation() {
            stopSimulation();
            time = 0;
            currentOscillations = 0;
            progressBar.style.width = '0%';
            drawPendulum();
        }
        
        // الأحداث
        freqSlider.addEventListener('input', updateValues);
        ampSlider.addEventListener('input', updateValues);
        oscSlider.addEventListener('input', updateValues);
        
        startBtn.addEventListener('click', startSimulation);
        pauseBtn.addEventListener('click', stopSimulation);
        resetBtn.addEventListener('click', resetSimulation);
        
        // التهيئة الأولية
        updateValues();
        drawPendulum();
    </script>
</body>
</html>
